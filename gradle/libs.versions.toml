[versions]
android-gradle-plugin = "8.5.2"
androidx-activity-compose = "1.9.1"
androidx-annotations = "1.8.2"
androidx-browser = "1.8.0"
androidx-credentials = "1.2.2"
androidx-lifecycle = "2.8.4"
androidx-security-crypto = "1.0.0"
compose-multiplatform = "1.6.11"
compose-multiplatform-compiler = "1.5.8.1"
google-id = "1.1.1"
gradle-nexus-publish-plugin = "1.3.0"
json-jvm = "20231013"
kotlin = "1.9.25"
kotlinx-coroutines = "1.8.1"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity-compose" }
androidx-annotations = { module = "androidx.annotation:annotation", version.ref = "androidx-annotations" }
androidx-browser = { module = "androidx.browser:browser", version.ref = "androidx-browser" }
androidx-credentials = { module = "androidx.credentials:credentials", version.ref = "androidx-credentials" }
androidx-credentials-play-services-auth = { module = "androidx.credentials:credentials-play-services-auth", version.ref = "androidx-credentials" }
androidx-lifecycle-common = { module = "androidx.lifecycle:lifecycle-common", version.ref = "androidx-lifecycle" }
androidx-lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "androidx-lifecycle" }
androidx-security-crypto = { module = "androidx.security:security-crypto", version.ref = "androidx-security-crypto" }
google-id = { module = "com.google.android.libraries.identity.googleid:googleid", version.ref = "google-id" }
json-jvm = { module = "org.json:json", version.ref = "json-jvm" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlinx-coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }

[plugins]
android-application = { id = "com.android.application", version.ref = "android-gradle-plugin" }
android-library = { id = "com.android.library", version.ref = "android-gradle-plugin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
gradle-nexus-publish = { id = "io.github.gradle-nexus.publish-plugin", version.ref = "gradle-nexus-publish-plugin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
